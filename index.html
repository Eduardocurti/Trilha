<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trilha de Carreira — Operações Cabana Burger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:#F0EDE4;color:#1a1a1a;min-height:100vh;display:flex;flex-direction:column}
:root{
  --green:#2E7D32;--green-light:#E8F5E9;--green-mid:#43A047;--green-dark:#1B5E20;
  --orange:#E84E1B;--orange-light:#FFF3E0;--orange-mid:#F57C00;
  --cream:#F0EDE4;--cream-card:#FAFAF7;
  --gray:#E8E4DB;--gray-b:#D8D4CB;--text-s:#6B6860;--white:#fff
}

/* ── NAVBAR ── */
.navbar{background:#1B5E20;height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:100}
.nav-left{display:flex;align-items:center;gap:10px}
.nav-logo-icon{width:34px;height:34px;background:#fff;border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.nav-logo-icon svg{width:20px;height:20px}
.nav-brand{font-family:'Playfair Display',Georgia,serif;font-size:20px;color:#fff;letter-spacing:-.3px}
.nav-brand sup{font-family:'Inter',sans-serif;font-size:9px;vertical-align:super;letter-spacing:0}
.nav-right{display:flex;align-items:center;gap:16px}
.nav-tag{font-size:10px;font-weight:600;letter-spacing:.8px;color:#fff;border:1px solid rgba(255,255,255,.4);padding:4px 12px;border-radius:20px;text-transform:uppercase}
.nav-units{font-size:11px;color:rgba(255,255,255,.7);font-weight:500}
.nav-name{font-size:11px;color:rgba(255,255,255,.9);font-weight:600;letter-spacing:.3px;text-transform:uppercase}

/* ── PAGE ── */
.page{max-width:980px;margin:0 auto;padding:32px 24px;flex:1}

/* ── PAGE HEADER ── */
.page-header{margin-bottom:24px}
.page-header-inner{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.accent-bar{width:4px;height:26px;background:var(--orange);border-radius:2px;flex-shrink:0}
h1{font-family:'Inter',sans-serif;font-size:20px;font-weight:600;letter-spacing:-.3px;color:#1a1a1a}
.subtitle{font-size:12px;color:var(--text-s);padding-left:14px}

/* ── FOOTER ── */
.footer{background:var(--orange);padding:22px 28px;text-align:center}
.footer-brand{font-family:'Playfair Display',Georgia,serif;font-size:22px;color:#fff;letter-spacing:-.2px}
.footer-brand sup{font-family:'Inter',sans-serif;font-size:10px;vertical-align:super;letter-spacing:0}
.footer-sub{font-size:11px;color:rgba(255,255,255,.85);letter-spacing:1.5px;text-transform:uppercase;margin-top:3px;font-weight:500}

/* LEGEND */
.legend{display:flex;gap:14px;flex-wrap:wrap;padding:10px 16px;background:var(--cream-card);border:1px solid var(--gray-b);border-radius:10px;margin-bottom:20px}
.leg{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text-s)}
.leg-dot{width:9px;height:9px;border-radius:50%}
.leg-pill{font-size:9px;padding:2px 6px;border-radius:8px;font-weight:600}

/* CLUSTER TABS */
.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:22px}
.tab{padding:6px 18px;border-radius:20px;border:1.5px solid var(--gray-b);font-size:12px;font-weight:500;cursor:pointer;background:var(--cream-card);color:var(--text-s);transition:all .18s}
.tab.on{background:var(--green);color:#fff;border-color:var(--green)}
.tab:hover:not(.on){border-color:var(--green);color:var(--green)}

/* SECTION */
.section{margin-bottom:22px}
.section-title{font-size:10px;font-weight:600;color:var(--text-s);text-transform:uppercase;letter-spacing:.8px;padding:5px 12px;background:var(--gray);border-left:3px solid var(--green);border-radius:0 4px 4px 0;margin-bottom:10px}
.section-title.eq{border-left-color:var(--orange)}
.cards-row{display:flex;gap:9px;flex-wrap:wrap}

/* CARD */
.card{background:var(--cream-card);border:1px solid var(--gray-b);border-radius:10px;padding:13px 15px;min-width:150px;flex:1;cursor:pointer;transition:all .2s;position:relative;overflow:hidden}
.card::before{content:'';position:absolute;top:0;left:0;width:3px;height:100%;background:var(--green)}
.card.eq::before{background:var(--orange)}
.card:hover{box-shadow:0 4px 18px rgba(46,125,50,.13);transform:translateY(-2px)}
.card.active{box-shadow:0 0 0 2.5px var(--green);transform:translateY(-2px)}
.card.active.eq{box-shadow:0 0 0 2.5px var(--orange)}
.card-title{font-size:12px;font-weight:600;color:#1a1a1a;margin-bottom:2px}
.card-sub{font-size:10px;color:var(--text-s);margin-bottom:7px}
.card-range{font-size:11px;font-weight:600;color:var(--green-dark)}
.card-range.eq{color:var(--orange)}
.tags{display:flex;gap:3px;flex-wrap:wrap;margin-top:6px}
.tag{font-size:9px;padding:2px 6px;border-radius:7px;font-weight:600}
.tag.cluster{background:var(--gray);color:var(--text-s)}
.tag.time-orange{background:var(--orange-light);color:var(--orange)}
.tag.time-green{background:var(--green-light);color:var(--green-dark)}
.tag.rv{background:var(--green-light);color:var(--green-dark)}

/* ARROW SEPARATOR */
.arrow-sep{display:flex;align-items:center;justify-content:center;gap:8px;margin:4px 0 11px}
.arrow-sep svg{width:16px;height:16px}
.arrow-sep span{font-size:10px;color:var(--text-s)}

/* DETAIL PANEL */
.detail{border:1.5px solid var(--gray-b);border-radius:14px;margin-top:10px;overflow:hidden;display:none;animation:slide-in .22s ease;background:var(--cream-card)}
.detail.open{display:block}
@keyframes slide-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

.detail-header{padding:18px 22px 14px;border-bottom:1px solid var(--gray-b);display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.detail-title{font-size:16px;font-weight:600;color:#1a1a1a}
.detail-meta{font-size:11px;color:var(--text-s);margin-top:3px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.close-btn{background:none;border:1px solid var(--gray-b);width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:16px;color:var(--text-s);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .15s}
.close-btn:hover{background:var(--gray)}

.detail-body{padding:18px 22px}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:22px}
@media(max-width:560px){.info-grid{grid-template-columns:1fr}}

/* COMP TABLE */
.comp-section{}
.sec-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--text-s);margin-bottom:9px}
.comp-boxes{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:11px}
.comp-box{background:var(--gray);border-radius:8px;padding:9px 8px;text-align:center;border:1px solid var(--gray-b)}
.comp-box .lbl{font-size:9px;color:var(--text-s);margin-bottom:3px}
.comp-box .val{font-size:13px;font-weight:600;color:#1a1a1a}
.comp-box .val.orange{color:var(--orange)}
.range-row{display:flex;justify-content:space-between;font-size:11px;color:var(--text-s);margin-bottom:4px}
.range-row span:last-child{font-weight:600;color:#1a1a1a}
.progress-track{background:var(--gray);border-radius:20px;height:5px;overflow:hidden}
.progress-fill{height:100%;border-radius:20px;background:var(--green)}
.mid-label{font-size:10px;color:var(--text-s);margin-top:4px}

/* REQ / COMP LIST */
.list-section{}
.req-list{list-style:none;display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.req-list li{font-size:11px;color:var(--text-s);display:flex;gap:6px;line-height:1.4}
.req-list li::before{content:'✓';color:var(--green);font-weight:700;flex-shrink:0;margin-top:1px}
.comp-tags{display:flex;flex-wrap:wrap;gap:5px}
.comp-tag{font-size:10px;padding:3px 9px;border-radius:9px;background:var(--green-light);color:var(--green-dark);font-weight:500}
.next-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.next-tag{font-size:10px;padding:4px 10px;border-radius:9px;background:var(--green-light);color:var(--green-dark);font-weight:600;border:1px solid #A5D6A7}
.alt-note{font-size:10px;color:var(--text-s);background:#FFF8F5;border-radius:6px;padding:7px 11px;margin-top:9px;border-left:2.5px solid var(--orange);line-height:1.6}

/* ───────────────────────────────────────── */
/* TIMELINE SECTION                          */
/* ───────────────────────────────────────── */
.timeline-section{border-top:1px solid var(--gray-b);padding:20px 22px 22px}
.timeline-header{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--text-s);margin-bottom:18px;display:flex;align-items:center;gap:6px}

.tl-outer{overflow-x:auto;padding-bottom:6px}
.tl-canvas{position:relative;min-width:640px}
/* horizontal spine */
.tl-spine{position:absolute;top:36px;left:0;right:0;height:2px;background:linear-gradient(to right, var(--green-mid), var(--green-dark))}

/* Each stop */
.tl-stops{display:flex;align-items:flex-start;position:relative}
.tl-stop{display:flex;flex-direction:column;align-items:center;flex:1;min-width:110px;position:relative}

/* dot on spine */
.tl-dot{width:14px;height:14px;border-radius:50%;border:2.5px solid var(--green);background:#fff;z-index:2;position:relative;margin:0 auto;cursor:pointer;transition:all .18s;flex-shrink:0}
.tl-dot.current{background:var(--green);box-shadow:0 0 0 4px var(--green-light)}
.tl-dot.dest{background:var(--green-dark);border-color:var(--green-dark);box-shadow:0 0 0 4px #C8E6C9}
.tl-dot.gestao{border-color:var(--green-mid);background:var(--green-light)}
.tl-dot.equipe{border-color:var(--orange-mid);background:var(--orange-light)}
.tl-stop:hover .tl-dot{transform:scale(1.25)}

/* connector line between stops */
.tl-connector{position:absolute;top:29px;left:50%;width:100%;height:2px;background:var(--green-mid);z-index:1}
.tl-connector.alt{background:repeating-linear-gradient(to right,var(--orange) 0,var(--orange) 5px,transparent 5px,transparent 9px)}

/* time badge above dot */
.tl-time{font-size:9px;font-weight:600;padding:2px 7px;border-radius:8px;margin-bottom:6px;white-space:nowrap;min-height:17px}
.tl-time.orange{background:var(--orange-light);color:var(--orange)}
.tl-time.green{background:var(--green-light);color:var(--green-dark)}
.tl-time.blank{background:transparent;color:transparent}

/* card below dot */
.tl-card{background:var(--cream-card);border:1px solid var(--gray-b);border-radius:8px;padding:8px 10px;margin-top:7px;width:calc(100% - 10px);text-align:center;cursor:pointer;transition:all .18s;position:relative;overflow:hidden}
.tl-card::before{content:'';position:absolute;bottom:0;left:0;right:0;height:2.5px;background:var(--green)}
.tl-card.eq::before{background:var(--orange)}
.tl-card.current-card{border-color:var(--green);box-shadow:0 0 0 2px var(--green-light)}
.tl-card.dest-card{border-color:var(--green-dark);background:var(--green-light)}
.tl-card:hover{box-shadow:0 3px 12px rgba(46,125,50,.14);transform:translateY(-2px)}
.tl-card-name{font-size:10px;font-weight:600;color:#1a1a1a;margin-bottom:2px}
.tl-card-sal{font-size:9px;color:var(--green-dark);font-weight:600}
.tl-card-sal.eq{color:var(--orange)}
.tl-card-cluster{font-size:8px;color:var(--text-s);margin-top:2px}

/* FORK (alternative paths) */
.tl-fork{margin-top:20px;border-top:1px dashed var(--gray-b);padding-top:16px}
.fork-label{font-size:10px;color:var(--text-s);margin-bottom:12px;display:flex;align-items:center;gap:5px}
.fork-row{display:flex;gap:10px;flex-wrap:wrap}
.fork-option{flex:1;min-width:120px;background:var(--gray);border-radius:9px;padding:10px 12px;border-left:3px solid var(--orange)}
.fork-option-title{font-size:10px;font-weight:600;color:#1a1a1a;margin-bottom:3px}
.fork-option-path{font-size:9px;color:var(--text-s);line-height:1.5}

/* legend inside timeline */
.tl-legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px}
.tl-leg{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--text-s)}
.tl-leg-dot{width:10px;height:10px;border-radius:50%}
</style>
</head>

/* ─────────────── HELPERS ─────────────── */
const f = v => v ? 'R$ ' + v.toLocaleString('pt-BR') : '—';

let currentCluster = 'all';
let selectedKey = null;

function setCluster(c, el) {
  currentCluster = c;
  selectedKey = null;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('on'));
  el.classList.add('on');
  document.getElementById('detail').classList.remove('open');

function visible(k) {
  return currentCluster === 'all' || D[k].cluster === currentCluster || D[k].cluster === 'all';
}

/* ─────────────── CARD HTML ─────────────── */
function cardHTML(k) {
  const d = D[k];
  const eq = d.type === 'e';
  const sel = selectedKey === k;
  const range = d.tot.min === d.tot.max
    ? f(d.tot.min)
    : f(d.tot.min) + ' – ' + f(d.tot.max);
  return `<div class="card${eq?' eq':''}${sel?' active':''}" id="card-${k}" onclick="openDetail('${k}')">
    <div class="card-title">${d.label}</div>
    <div class="card-sub">${d.seniority}</div>
    <div class="card-range${eq?' eq':''}">${range}</div>
    <div class="tags">
      <span class="tag cluster">Cluster ${d.cluster==='all'?'Todas':d.cluster}</span>
      ${d.tempo ? `<span class="tag ${d.tempo==='3 meses'?'time-orange':'time-green'}">⏱ ${d.tempo}</span>` : ''}
      ${d.rv.max > 0 ? `<span class="tag rv">+RV ${f(d.rv.max)}</span>` : ''}
    </div>
  </div>`;
}

function arrowHTML(label) {
  return `<div class="arrow-sep">
    <svg viewBox="0 0 24 24" fill="none" stroke="#43A047" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/>

/* ─────────────── TIMELINE SVG ─────────────── */
function buildTimeline(key) {
  const stdPath = STANDARD_PATHS[key];
  const altObj  = ALT_PATHS[key] || null;
  if (!stdPath || stdPath.length < 2) return '';

  function timelineRow(path, isCurrent) {
    const EQ = d => D[d].type === 'e';
    const ROW_H = 130;
    const DOT_Y = 36;
    const CARD_TOP = DOT_Y + 14;
    const CARD_H = 52;
    const n = path.length;

    // Compute per-stop width evenly
    const stopW = Math.max(110, Math.floor(640 / n));
    const svgW = stopW * n + 20;
    const svgH = ROW_H;

    let svg = `<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 ${svgW} ${svgH}" style="min-width:${Math.min(svgW,640)}px">`;

    // Spine line
    const spineX1 = stopW / 2;
    const spineX2 = svgW - stopW / 2;
    svg += `<line x1="${spineX1}" y1="${DOT_Y}" x2="${spineX2}" y2="${DOT_Y}" stroke="#A5D6A7" stroke-width="2"/>`;

    path.forEach((k, i) => {
      const d = D[k];
      const cx = stopW / 2 + i * stopW;
      const isCur = (k === key);
      const isTop = (k === 'regional');
      const isEq = EQ(k);
      const nextK = path[i + 1];
      const nextD = nextK ? D[nextK] : null;
      const timeLabel = nextD ? (nextD.tempo || '') : '';

      // Connector between this dot and next
      if (nextK) {
        const nx = stopW / 2 + (i + 1) * stopW;
        const isAlt = isCurrent === 'alt';
        svg += `<line x1="${cx + 7}" y1="${DOT_Y}" x2="${nx - 7}" y2="${DOT_Y}"
          stroke="${isAlt ? '#F57C00' : '#43A047'}" stroke-width="2"
          ${isAlt ? 'stroke-dasharray="6 3"' : ''}/>`;
        // Arrow head
        svg += `<polyline points="${nx-12},${DOT_Y-5} ${nx-6},${DOT_Y} ${nx-12},${DOT_Y+5}"
          fill="none" stroke="${isAlt ? '#F57C00' : '#43A047'}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>`;
        // Time badge between stops
        if (timeLabel) {
          const mx = cx + stopW / 2;
          const isOrange = timeLabel === '3 meses';
          svg += `<rect x="${mx - 22}" y="${DOT_Y - 23}" width="44" height="14" rx="5"
            fill="${isOrange ? '#FFF3E0' : '#E8F5E9'}"/>`;
          svg += `<text x="${mx}" y="${DOT_Y - 12}" text-anchor="middle"
            font-family="-apple-system,sans-serif" font-size="8" font-weight="600"
            fill="${isOrange ? '#E65100' : '#2E7D32'}">${timeLabel}</text>`;
        }
      }

      // Dot
      const dotFill = isCur ? '#2E7D32' : isTop ? '#1B5E20' : isEq ? '#FFF3E0' : '#E8F5E9';
      const dotStroke = isCur ? '#2E7D32' : isTop ? '#1B5E20' : isEq ? '#E65100' : '#43A047';
      const dotR = isCur || isTop ? 9 : 7;
      if (isCur) {
        svg += `<circle cx="${cx}" cy="${DOT_Y}" r="14" fill="#E8F5E9" opacity="0.7"/>`;
      }
      svg += `<circle cx="${cx}" cy="${DOT_Y}" r="${dotR}" fill="${dotFill}" stroke="${dotStroke}" stroke-width="2"/>`;
      if (isCur) {
        svg += `<text x="${cx}" y="${DOT_Y + 1}" text-anchor="middle" dominant-baseline="central"
          font-family="-apple-system,sans-serif" font-size="8" font-weight="700" fill="#fff">●</text>`;
      }

      // Card below dot
      const cw = stopW - 10;
      const cx0 = cx - cw / 2;
      const cardFill = isCur ? '#E8F5E9' : isTop ? '#1B5E20' : '#FAFAF7';
      const cardStroke = isCur ? '#2E7D32' : isTop ? '#1B5E20' : isEq ? '#F57C00' : '#C8E6C9';
      const sw = isCur || isTop ? 1.5 : 1;

      svg += `<rect x="${cx0}" y="${CARD_TOP}" width="${cw}" height="${CARD_H}" rx="7"
        fill="${cardFill}" stroke="${cardStroke}" stroke-width="${sw}"/>`;
      // bottom accent
      const accentColor = isEq ? '#E65100' : '#2E7D32';
      svg += `<rect x="${cx0}" y="${CARD_TOP + CARD_H - 3}" width="${cw}" height="3" rx="0 0 7 7"
        fill="${accentColor}" opacity="0.7"/>`;

      // Title (truncate)
      const shortName = d.label.replace(' — ', '\n').replace(' - ', '\n');
      const lines = shortName.split('\n');
      const titleColor = isTop ? '#fff' : '#1a1a1a';
      const salColor = isTop ? '#A5D6A7' : isEq ? '#E65100' : '#2E7D32';
      const salStr = d.tot.min === d.tot.max ? f(d.tot.min) : f(d.tot.min) + '+';

      if (lines.length > 1) {
        svg += `<text x="${cx}" y="${CARD_TOP + 14}" text-anchor="middle"
          font-family="-apple-system,sans-serif" font-size="9" font-weight="600" fill="${titleColor}">${lines[0]}</text>`;
        svg += `<text x="${cx}" y="${CARD_TOP + 26}" text-anchor="middle"
          font-family="-apple-system,sans-serif" font-size="8.5" font-weight="500" fill="${titleColor}">${lines[1]}</text>`;
      } else {
        svg += `<text x="${cx}" y="${CARD_TOP + 18}" text-anchor="middle"
          font-family="-apple-system,sans-serif" font-size="9" font-weight="600" fill="${titleColor}">${lines[0]}</text>`;
      }
      svg += `<text x="${cx}" y="${CARD_TOP + 38}" text-anchor="middle"
        font-family="-apple-system,sans-serif" font-size="9" font-weight="600" fill="${salColor}">${salStr}</text>`;
      const clusterTxt = d.cluster === 'all' ? 'Todas' : 'Cluster ' + d.cluster;
      svg += `<text x="${cx}" y="${CARD_TOP + 49}" text-anchor="middle"
        font-family="-apple-system,sans-serif" font-size="8" fill="${isTop ? '#A5D6A7' : '#9E9E9E'}">${clusterTxt}</text>`;
    });

    svg += '</svg>';
    return svg;
  }

  // Build standard path
  let html = `<div class="tl-outer">${timelineRow(stdPath, 'std')}</div>`;

  // Build alt path if available
  if (altObj) {
    html += `<div class="tl-fork">
      <div class="fork-label">
        <span style="font-size:14px">↔</span>
        <strong style="color:var(--orange)">${altObj.label}</strong>
        <span style="color:var(--text-s)">— opção para quem está neste cargo</span>
      </div>
      <div class="tl-outer">${timelineRow(altObj.path, 'alt')}</div>
    </div>`;
  }

  // Time total estimate
  const tempos = stdPath.map(k => D[k].tempo || null).filter(Boolean);
  const meses = tempos.reduce((acc, t) => {
    if (t === '3 meses') return acc + 3;
    if (t === '1 ano') return acc + 12;
    return acc;
  }, 0);
  const anos = Math.floor(meses / 12);
  const mesRest = meses % 12;
  const tempoStr = anos > 0 ? `${anos} ano${anos>1?'s':''}${mesRest > 0 ? ` e ${mesRest} mese${mesRest>1?'s':''}` : ''}` : `${meses} meses`;

  html += `<div class="tl-legend">
    <div class="tl-leg"><circle class="tl-leg-dot" style="background:#2E7D32;border-radius:50%;width:10px;height:10px;display:inline-block"></circle>Cargo atual</div>
    <div class="tl-leg"><circle class="tl-leg-dot" style="background:#1B5E20;border-radius:50%;width:10px;height:10px;display:inline-block"></circle>Destino final</div>
    <div class="tl-leg"><circle class="tl-leg-dot" style="background:#E8F5E9;border:1.5px solid #43A047;border-radius:50%;width:10px;height:10px;display:inline-block"></circle>Gestão</div>
    <div class="tl-leg"><circle class="tl-leg-dot" style="background:#FFF3E0;border:1.5px solid #E65100;border-radius:50%;width:10px;height:10px;display:inline-block"></circle>Equipe</div>
    <div class="tl-leg" style="margin-left:auto;background:var(--green-light);padding:3px 10px;border-radius:8px;color:var(--green-dark);font-weight:600">⏱ Tempo estimado até o topo: <strong>${tempoStr}</strong></div>
  </div>`;

  return html;
}

/* ─────────────── DETAIL PANEL ─────────────── */

  selectedKey = key;
  // refresh active state on cards
  document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
  const el = document.getElementById('card-' + key);
  if (el) el.classList.add('active');

  const d = D[key];
  const eq = d.type === 'e';
  const pp = Math.round((d.tot.mid / d.tot.max) * 100);
  const tBadge = d.tempo
    ? `<span class="tag ${d.tempo==='3 meses'?'time-orange':'time-green'}" style="font-size:10px;padding:3px 8px">⏱ Mín. ${d.tempo} no cargo</span>`
    : `<span class="tag cluster" style="font-size:10px;padding:3px 8px">Cargo de entrada</span>`;

  const proxHTML = d.prox.length
    ? d.prox.map(k => `<span class="next-tag">${D[k].label}</span>`).join('')
    : `<span style="font-size:11px;color:var(--text-s)">Topo da carreira</span>`;

  const altHTML = d.alt
    ? `<div class="alt-note">↔ ${d.alt}</div>` : '';

  const tlHTML = buildTimeline(key);

  const panel = document.getElementById('detail');
  panel.innerHTML = `
    <div class="detail-header">
      <div>
        <div class="detail-title">${d.label}</div>
        <div class="detail-meta">${d.seniority} &nbsp;·&nbsp; Cluster ${d.cluster==='all'?'Todas as lojas':d.cluster} &nbsp; ${tBadge}</div>
      </div>
      <button class="close-btn" onclick="closeDetail()">×</button>
    </div>
    <div class="detail-body">
      <div class="info-grid">
        <!-- LEFT -->
        <div>
          <div class="comp-section">
            <div class="sec-label">💰 Remuneração PJ — Faixas</div>
            <div class="comp-boxes">
              <div class="comp-box">
                <div class="lbl">Fixo mensal</div>
                <div class="val">${f(d.fixo)}</div>
              </div>
              <div class="comp-box">
                <div class="lbl">Gorjeta (mid)</div>
                <div class="val">${f(d.gorj.mid)}</div>
              </div>
              <div class="comp-box">
                <div class="lbl">RV máximo</div>
                <div class="val orange">${d.rv.max ? f(d.rv.max) : '—'}</div>
              </div>
            </div>
            <div class="comp-boxes" style="margin-top:4px">
              <div class="comp-box">
                <div class="lbl">Total mínimo</div>
                <div class="val" style="font-size:11px">${f(d.tot.min)}</div>
              </div>
              <div class="comp-box">
                <div class="lbl">Total médio</div>
                <div class="val" style="font-size:11px;color:var(--green-dark)">${f(d.tot.mid)}</div>
              </div>
              <div class="comp-box">
                <div class="lbl">Total máximo</div>
                <div class="val" style="font-size:11px">${f(d.tot.max)}</div>
              </div>
            </div>
            <div class="range-row"><span>Faixa total</span><span>${f(d.tot.min)} – ${f(d.tot.max)}</span></div>
            <div class="progress-track"><div class="progress-fill" style="width:${pp}%"></div></div>
            <div class="mid-label">Mid: ${f(d.tot.mid)}</div>
          </div>

          <div class="req-list-section" style="margin-top:16px">
            <div class="sec-label">✅ Requisitos para o cargo</div>
            <ul class="req-list">${d.req.map(r=>`<li>${r}</li>`).join('')}</ul>
          </div>
        </div>
        <!-- RIGHT -->
        <div>
          <div class="sec-label">⭐ Competências esperadas</div>
          <div class="comp-tags">${d.comp.map(c=>`<span class="comp-tag">${c}</span>`).join('')}</div>

          <div style="margin-top:16px">
            <div class="sec-label">↑ Próximos passos na trilha</div>
            <div class="next-row">${proxHTML}</div>
            ${altHTML}
          </div>

          ${d.gorj.min !== d.gorj.max ? `
          <div style="margin-top:16px">
            <div class="sec-label">📊 Detalhamento de gorjeta</div>
            <div class="comp-boxes">
              <div class="comp-box"><div class="lbl">Gorjeta mín</div><div class="val" style="font-size:11px">${f(d.gorj.min)}</div></div>
              <div class="comp-box"><div class="lbl">Gorjeta mid</div><div class="val" style="font-size:11px">${f(d.gorj.mid)}</div></div>
              <div class="comp-box"><div class="lbl">Gorjeta máx</div><div class="val" style="font-size:11px">${f(d.gorj.max)}</div></div>
            </div>
          </div>` : ''}

          ${d.rv.max > 0 ? `
          <div style="margin-top:16px">
            <div class="sec-label">🎯 Detalhamento de RV</div>
            <div class="comp-boxes">
              <div class="comp-box"><div class="lbl">RV mínimo</div><div class="val orange" style="font-size:11px">${f(d.rv.min)}</div></div>
              <div class="comp-box"><div class="lbl">RV médio</div><div class="val orange" style="font-size:11px">${f(d.rv.mid)}</div></div>
              <div class="comp-box"><div class="lbl">RV máximo</div><div class="val orange" style="font-size:11px">${f(d.rv.max)}</div></div>
            </div>
          </div>` : ''}
        </div>
      </div>

      <!-- TIMELINE -->
      ${tlHTML ? `<div class="timeline-section">
        <div class="timeline-header">🗺 Jornada até o topo — a partir de <span style="color:var(--green-dark);margin-left:4px">${d.label}</span></div>
        ${tlHTML}
      </div>` : ''}
    </div>
  `;
  panel.classList.add('open');
  panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function closeDetail() {
  selectedKey = null;
  document.getElementById('detail').classList.remove('open');
  document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
}

/* ─── INIT ─── */
renderBoard();
</script>
